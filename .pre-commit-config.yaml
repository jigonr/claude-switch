repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: check-yaml
      - id: check-json
      - id: check-added-large-files
        args: ['--maxkb=500']
      - id: check-merge-conflict
      - id: detect-private-key

  - repo: local
    hooks:
      - id: bun-format
        name: Bun format check
        entry: bun fmt --no-script --check --
        language: system
        types_or: [javascript, ts, json]
        files: ^(src/|tests/|(?:package|tsconfig)\.json$|(?:tsup|vitest)\.config\.ts$)

      - id: bun-typecheck
        name: Bun TypeScript check
        entry: bun check --no-script --
        language: system
        types: [ts]
        files: ^(src/|(?:tsup|vitest)\.config\.ts$)

      - id: bun-js-typecheck
        name: Bun JavaScript check
        entry: bun check --no-script --allowJs --checkJs --
        language: system
        types: [javascript]
        files: ^tests/integration/

      - id: staged-whitespace
        name: Check staged whitespace without rewriting files
        entry: git diff --cached --check --diff-filter=ACMR --
        language: system
        pass_filenames: false
